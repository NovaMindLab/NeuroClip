name: Release (跨平台自动构建打包与多端发布)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如: v0.3.0)'
        required: true
        default: 'v0.3.0'
        type: string
      release_title:
        description: 'Release 标题'
        required: false
        default: 'NeuroClip 智能高光切片与解说系统'
        type: string
      draft:
        description: '是否保存为草稿 (Draft Release)'
        required: false
        default: false
        type: boolean
      prerelease:
        description: '是否标记为预发布 (Pre-release)'
        required: false
        default: false
        type: boolean

jobs:
  tag-creation:
    name: 🏷️ 自动化创建并同步远端 Git 标签
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定发布版本标签
        id: set_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag -a "$TAG" -m "Release $TAG via GitHub Actions"
              git push origin "$TAG"
            fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    name: 📦 跨平台构建与发布 Release (${{ matrix.platform_name }})
    needs: tag-creation
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            platform_name: 'Windows x64'
            args: ''
            cli_binary: 'src-tauri/target/release/neuroclip-cli.exe'
            asset_name: 'neuroclip-cli-windows-x64.exe'
          - platform: 'macos-latest'
            platform_name: 'macOS Apple Silicon'
            args: '--target aarch64-apple-darwin'
            cli_binary: 'src-tauri/target/aarch64-apple-darwin/release/neuroclip-cli'
            asset_name: 'neuroclip-cli-macos-arm64'
          - platform: 'ubuntu-22.04'
            platform_name: 'Linux x64'
            args: ''
            cli_binary: 'src-tauri/target/release/neuroclip-cli'
            asset_name: 'neuroclip-cli-linux-x64'

    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux 系统图形与音视频依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 Rust 编译环境
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端静态文件
        run: npm run build

      - name: 编译跨平台独立 CLI 命令行执行程序
        run: |
          cd src-tauri
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cargo build --release --bin neuroclip-cli --target aarch64-apple-darwin
          else
            cargo build --release --bin neuroclip-cli
          fi
          cd ..

      - name: 🛡️ [Windows] 生成专有 Authenticode 代码签名证书并对 CLI 签名
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "===> 生成 NeuroClip 专属 Authenticode 代码签名证书..."
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=NovaMindLab NeuroClip, O=NovaMindLab" -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(5)
          
          Export-Certificate -Cert $cert -FilePath "neuroclip-root.cer"
          
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Select-Object -First 1).FullName
          Write-Host "使用 signtool: $signtool"
          
          if (Test-Path "src-tauri\target\release\neuroclip-cli.exe") {
            Write-Host "正在对 CLI 程序施加 SHA-256 签名与 DigiCert 时间戳..."
            & $signtool sign /sha1 $cert.Thumbprint /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "src-tauri\target\release\neuroclip-cli.exe"
          }

          $bat = "@echo off`r`nchcp 65001 >nul`r`necho ========================================================`r`necho       NeuroClip 官方安全数字签名证书一键导入工具`r`necho ========================================================`r`necho.`r`necho 正在向系统导入受信任根证书以消除 Windows 拦截...`r`necho.`r`ncertutil -addstore -f `"Root`" `"%~dp0neuroclip-root.cer`"`r`nif %errorlevel% equ 0 (`r`n    echo.`r`n    echo [成功] NeuroClip 官方安全证书已成功导入系统受信任证书库！`r`n    echo 现在您可以顺畅运行或升级 NeuroClip，不会再出现未知发布者拦截。`r`n) else (`r`n    echo.`r`n    echo [提示] 导入失败，请右键点击本脚本，选择【以管理员身份运行】。`r`n)`r`necho.`r`npause"
          [System.IO.File]::WriteAllText("一键安装证书-消除拦截.bat", $bat, [System.Text.Encoding]::UTF8)

      - name: 运行 Tauri Action 打包桌面端应用并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.tag-creation.outputs.release_tag }}
          releaseName: 'NeuroClip ${{ needs.tag-creation.outputs.release_tag }}'
          releaseBody: |
            ## 🌟 NeuroClip 桌面端与云端执行引擎更新发布 (${{ needs.tag-creation.outputs.release_tag }})
            
            ### ✨ 包含产物:
            - **Windows 桌面端安装包**：`.msi` / `.exe` (NSIS) 安装程序，已嵌入 Authenticode SHA-256 数字签名与权威时间戳。
            - **Windows 证书信任工具包**：包含 `neuroclip-root.cer` 与 `一键安装证书-消除拦截.bat`，导入后永久消除 Defender / SmartScreen 拦截。
            - **macOS 桌面端安装包**：`.dmg` / `.app`，针对 Apple Silicon 原生优化。
            - **Linux 桌面端安装包**：`.deb` / `.AppImage`。
            - **跨平台独立 CLI 工具**：可在任何本地机器、云服务器或 CI 环境独立无头运行。
            
            ### 🛠️ 核心功能:
            - **秒开体验升级**：内存级 0ms 状态探查缓存 + 平台硬件加速 Fast-Path，彻底根除冷启动白屏与卡顿。
            - **左右双栏现代工作台**：高光剪辑工作台 + PC 本地视频资产库 + 无人值守监听 + 硬件设置。
            - **PC 视频极速扫描入库**：基于 SQLite3 (WAL 模式)，深度剪枝防卡死，单事务万级毫秒入库。
            - **短视频工业化重构**：9:16 动态高斯模糊虚化背景，逐字跳动高亮动效 ASS 字幕。
            - **三轨侧链闪避混音**：人声出声自动下潜原片环境音 -12dB 与背景 BGM -15dB。
            - **硬件编解码加速**：自适应激活 Apple VideoToolbox、NVIDIA NVENC、AMD AMF 与 Intel QSV。
          releaseDraft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          args: ${{ matrix.args }}

      - name: 🛡️ [Windows] 对安装包 (.exe / .msi) 施加数字签名并覆盖上传 Release
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Select-Object -First 1).FullName
          $cert = Get-ChildItem -Path "Cert:\CurrentUser\My" | Where-Object { $_.Subject -like "*NovaMindLab NeuroClip*" } | Select-Object -First 1
          
          # 对所有 NSIS exe 与 WiX msi 安装包施加数字签名
          $bundles = Get-ChildItem -Path "src-tauri\target\release\bundle" -Include "*.exe", "*.msi" -Recurse
          foreach ($b in $bundles) {
            Write-Host "正在对安装包施加数字签名与时间戳: $($b.FullName)..."
            & $signtool sign /sha1 $cert.Thumbprint /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $b.FullName
            Write-Host "上传签名后的安装包至 Release..."
            gh release upload "${{ needs.tag-creation.outputs.release_tag }}" "$($b.FullName)" --clobber
          }
          
          if (Test-Path "neuroclip-root.cer") {
            Write-Host "上传受信任证书包至 Release..."
            gh release upload "${{ needs.tag-creation.outputs.release_tag }}" "neuroclip-root.cer" "一键安装证书-消除拦截.bat" --clobber
          }

      - name: 上传独立 CLI 命令行程序至 GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLI_PATH="${{ matrix.cli_binary }}"
          ASSET_NAME="${{ matrix.asset_name }}"
          if [ -f "$CLI_PATH" ]; then
            echo "正在上传 $CLI_PATH 为 $ASSET_NAME 到版本 ${{ needs.tag-creation.outputs.release_tag }}..."
            gh release upload "${{ needs.tag-creation.outputs.release_tag }}" "$CLI_PATH#$ASSET_NAME" --clobber || true
          else
            echo "警告: 未找到 CLI 二进制文件: $CLI_PATH"
          fi
