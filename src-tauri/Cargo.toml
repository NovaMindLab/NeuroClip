[package]
name = "neuroclip"
version = "0.3.0"
description = "NeuroClip: AI Desktop Automated Long Video Highlight Clipping & Smart Commentary System"
authors = ["NovaMindLab"]
edition = "2021"
default-run = "neuroclip"

[lib]
name = "neuroclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
hound = "3.5"
regex = "1.10"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
tempfile = "3.10"
notify = "6.1"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2.5"
dirs = "5.0"

[features]
default = []

[[bin]]
name = "neuroclip"
path = "src/main.rs"

[[bin]]
name = "neuroclip-cli"
path = "src/bin/cli.rs"
